name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and publish
        shell: pwsh
        run: ./build.ps1 -Headless -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: SplitDeck-Windows-x64-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/SplitDeck-*-windows-x64.zip
            artifacts/SplitDeck-*-windows-x64.zip.sha256
